<style>
.rd{--rd-bg:light-dark(#f4f6f8,#141b24);--rd-panel:light-dark(#ffffff,#1b2531);--rd-ink:light-dark(#172b3b,#e4edf4);--rd-muted:light-dark(#5d6e7b,#a3b5c3);--rd-line:light-dark(#e0e7ed,#334453);--rd-accent:light-dark(#087b70,#6cdbcc);--rd-soft:light-dark(#e7f5f1,#223e3b);--rd-warn:light-dark(#956117,#ecc788);--rd-wash:light-dark(#f9fafb,#202d39);--rd-space:24px;--rd-radius:16px;box-sizing:border-box;background:var(--rd-bg);color:var(--rd-ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border:1px solid var(--rd-line);border-radius:18px;overflow:clip;min-height:780px;position:relative}
.rd *{box-sizing:border-box}.rd button,.rd input,.rd select,.rd textarea{font:inherit}.rd button{color:inherit}.rd button:focus-visible,.rd input:focus-visible,.rd select:focus-visible,.rd textarea:focus-visible{outline:3px solid var(--rd-accent);outline-offset:3px}.rd button{cursor:inherit}.rd button:disabled{opacity:.5}.rd [hidden]{display:none!important}.rd h2,.rd h3,.rd p{margin:0}.rd h2{font-size:25px;font-weight:500;letter-spacing:-.6px}.rd h3{font-size:16px;font-weight:500}.rd small{font-size:12px}.rd .muted{color:var(--rd-muted)}.rd .tiny{font-size:12px}.rd .eyebrow{font-size:11px;font-weight:500;letter-spacing:1.6px;text-transform:uppercase;color:var(--rd-muted)}.rd .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rd .between{justify-content:space-between}.rd .stack{display:grid;gap:18px}.rd .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 8px;border-radius:6px;background:var(--rd-wash);color:var(--rd-muted)}.rd .tag.good{color:var(--rd-accent);background:var(--rd-soft)}.rd .tag.warn{color:var(--rd-warn)}.rd .ctl{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--rd-panel);color:var(--rd-ink);border:1px solid var(--rd-line);border-radius:9px;padding:9px 13px;min-height:38px;font-weight:500;white-space:normal;text-align:center}.rd .ctl.primary{background:var(--rd-accent);border-color:var(--rd-accent);color:light-dark(#fff,#112722)}.rd .ctl.quiet{background:transparent;border-color:transparent}.rd .ctl.small{padding:6px 9px;min-height:32px;font-size:12px}.rd .ctl.ai{background:var(--rd-soft);border-color:transparent;color:var(--rd-accent)}.rd i[data-lucide]{display:inline-block;width:16px;height:16px;flex-shrink:0}.rd .mark{display:flex;align-items:center;justify-content:center;background:var(--rd-accent);color:light-dark(#fff,#112722);width:32px;height:32px;border-radius:10px}.rd .brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:500;letter-spacing:-.4px}.rd .chrome{padding:17px 24px;border-bottom:1px solid var(--rd-line);background:var(--rd-panel)}.rd .concept{padding-right:96px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.rd .sidebar{width:168px;flex-shrink:0;background:var(--rd-panel);border-right:1px solid var(--rd-line);padding:24px 13px;display:flex;flex-direction:column;gap:6px}.rd .side-label{padding:3px 10px 13px;color:var(--rd-muted);font-size:11px;letter-spacing:1.3px}.rd .navitem{border:0;background:transparent;display:flex;align-items:center;gap:10px;text-align:left;border-radius:9px;padding:11px 10px;width:100%;color:var(--rd-muted)}.rd .navitem.active{background:var(--rd-soft);color:var(--rd-accent);font-weight:500}.rd .side-foot{margin-top:auto;padding:24px 10px 0;font-size:12px;color:var(--rd-muted)}.rd .layout{display:flex;min-height:715px}.rd .main{flex:1;min-width:0;padding:var(--rd-space)}.rd .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:24px}.rd .sub{color:var(--rd-muted);margin-top:5px;font-size:13px}.rd .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.rd .stat{background:var(--rd-panel);border:1px solid var(--rd-line);border-radius:var(--rd-radius);padding:17px}.rd .stat .value{font-size:30px;font-weight:500;letter-spacing:-1px;margin:5px 0;font-variant-numeric:tabular-nums}.rd .sheet{background:var(--rd-panel);border:1px solid var(--rd-line);border-radius:var(--rd-radius);padding:20px;min-width:0}.rd .sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.rd .section-gap{margin-top:22px}.rd .tablewrap{overflow:auto}.rd table{border-collapse:collapse;width:100%;text-align:left;font-size:13px}.rd th{font-weight:400;color:var(--rd-muted);font-size:12px;padding:10px 9px;border-bottom:1px solid var(--rd-line)}.rd td{padding:13px 9px;border-bottom:1px solid var(--rd-line);vertical-align:middle}.rd tr:last-child td{border-bottom:0}.rd td strong{font-weight:500}.rd .num{font-variant-numeric:tabular-nums;text-align:right}.rd .initial{width:30px;height:30px;border-radius:8px;background:var(--rd-wash);display:inline-flex;align-items:center;justify-content:center;color:var(--rd-muted);font-size:11px;font-weight:500}.rd .assetcell{display:flex;gap:10px;align-items:center}.rd .path{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 0}.rd .node{background:var(--rd-wash);border-radius:10px;padding:12px 14px;min-width:77px;flex:1;text-align:center}.rd .node.target{background:var(--rd-soft);color:var(--rd-accent)}.rd .node .tiny{display:block;margin-top:4px}.rd .arrow{color:var(--rd-muted)}.rd .notice{padding:11px 13px;background:var(--rd-soft);border-radius:9px;color:var(--rd-accent);font-size:12px}.rd .footer-note{color:var(--rd-muted);font-size:11px;margin-top:16px}.rd .ai-panel{width:270px;flex-shrink:0;border-left:1px solid var(--rd-line);background:var(--rd-panel);padding:21px 18px;display:flex;flex-direction:column;gap:16px;align-self:stretch}.rd .ai-panel h3{font-size:17px}.rd .ai-context{background:var(--rd-wash);border-radius:10px;padding:12px;font-size:12px}.rd .ai-question{background:transparent;border:1px solid var(--rd-line);border-radius:8px;text-align:left;padding:10px;color:var(--rd-ink);width:100%;font-size:12px}.rd .ai-answer{background:var(--rd-soft);border-radius:12px;padding:14px;font-size:13px;line-height:1.65}.rd .ai-form{display:grid;gap:9px;margin-top:auto}.rd textarea,.rd input,.rd select{color:var(--rd-ink);background:var(--rd-panel);border:1px solid var(--rd-line);border-radius:9px;padding:10px;max-width:100%}.rd textarea{resize:vertical;min-height:82px;width:100%}.rd .ai-disclaimer{font-size:11px;color:var(--rd-muted)}.rd .tabs{display:flex;gap:22px;border-bottom:1px solid var(--rd-line);flex-wrap:wrap}.rd .tab{padding:11px 0;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--rd-muted)}.rd .tab.active{border-bottom-color:var(--rd-accent);color:var(--rd-accent)}.rd .steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:24px}.rd .step{display:flex;gap:10px;align-items:center;padding:14px 10px;background:var(--rd-panel);border:0;border-bottom:2px solid var(--rd-line);text-align:left;color:var(--rd-muted)}.rd .step.active{border-bottom-color:var(--rd-accent);color:var(--rd-accent)}.rd .step-num{width:25px;height:25px;flex-shrink:0;border-radius:50%;background:var(--rd-wash);display:flex;align-items:center;justify-content:center;font-size:12px}.rd .step.active .step-num{background:var(--rd-accent);color:light-dark(#fff,#112722)}.rd .flow-layout{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:24px}.rd .flow-layout .ai-panel{width:auto;border:1px solid var(--rd-line);border-radius:var(--rd-radius)}.rd .drop{border:1px dashed var(--rd-line);border-radius:12px;background:var(--rd-wash);padding:27px;text-align:center;display:grid;justify-items:center;gap:10px}.rd .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.rd .field-grid label{display:grid;gap:7px;font-size:12px}.rd .field-grid input{width:100%}.rd .field-grid .full{grid-column:1/-1}.rd .file-input{width:100%;font-size:12px}.rd .listitem{padding:13px 0;border-bottom:1px solid var(--rd-line);display:flex;justify-content:space-between;gap:12px}.rd .listitem:last-child{border:0}.rd .mini-strip{display:flex;align-items:center;gap:23px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--rd-line);margin-bottom:22px}.rd .mini-strip strong{font-weight:500;font-size:22px}.rd .focus-body{display:grid;grid-template-columns:minmax(0,1fr) 265px}.rd .focus-main{padding:var(--rd-space);min-width:0}.rd .focus-body .ai-panel{width:auto}.rd .focus-title{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.rd .focus-title h2{font-size:22px}.rd .viewslot{min-width:0}.rd .options{display:flex;gap:8px;flex-wrap:wrap}.rd .rankpill{font-size:12px;padding:4px 8px;border-radius:6px;background:var(--rd-soft);color:var(--rd-accent)}
@media(max-width:850px){.rd .sidebar{width:142px;padding-inline:8px}.rd .ai-panel{width:235px}.rd .main{padding:18px}.rd .flow-layout{grid-template-columns:minmax(0,1fr) 235px;gap:16px}.rd .sheet{padding:15px}.rd .concept{padding-right:76px}}
@media(max-width:680px){.rd{min-height:1100px}.rd .layout{display:block}.rd .sidebar{width:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--rd-line);padding:12px}.rd .navitem{width:auto;padding:9px}.rd .side-label,.rd .side-foot{display:none}.rd .ai-panel{width:auto;border-left:0;border-top:1px solid var(--rd-line)}.rd .stats{gap:8px}.rd .stat{padding:12px}.rd .stat .value{font-size:25px}.rd .flow-layout,.rd .focus-body{grid-template-columns:1fr}.rd .flow-layout .ai-panel{border:1px solid var(--rd-line)}.rd .step{padding:10px 5px;display:grid;gap:6px;font-size:11px}.rd .steps{margin-bottom:16px}.rd .main,.rd .focus-main{padding:16px}.rd .chrome{padding:15px 16px}.rd .concept{padding-right:70px;gap:8px}.rd .concept .eyebrow{display:none}.rd .sheet{padding:14px}.rd .tabs{gap:16px}.rd .field-grid{grid-template-columns:1fr}.rd .field-grid .full{grid-column:auto}.rd .node{padding:10px 6px;min-width:60px}.rd .path{gap:4px}.rd h2{font-size:22px}.rd .ctl{min-height:42px}.rd input,.rd textarea,.rd select{font-size:16px}.rd .row .tag{white-space:normal}}
</style>
<div id="risk-dashboard-concepts" class="viz-carousel" aria-label="Ba phương án thiết kế dashboard" data-previous-label="Bản trước" data-next-label="Bản tiếp">
<section data-variant="Tổng quan gọn" aria-label="Tổng quan gọn">
<div class="rd" id="rd-overview" aria-label="Dashboard Tổng quan gọn"></div>
</section>
<section data-variant="Từng bước rõ ràng" aria-label="Từng bước rõ ràng" hidden>
<div class="rd" id="rd-guided" aria-label="Dashboard Từng bước rõ ràng"></div>
</section>
<section data-variant="Phân tích tập trung" aria-label="Phân tích tập trung" hidden>
<div class="rd" id="rd-focus" aria-label="Dashboard Phân tích tập trung"></div>
</section>
</div>
<script>
(()=>{
const root=document.getElementById('risk-dashboard-concepts');
const defs=[{id:'rd-overview',name:'Tổng quan gọn',view:'overview',step:0,ai:false,patch:'',question:'',answer:''},{id:'rd-guided',name:'Từng bước rõ ràng',view:'overview',step:0,ai:true,patch:'',question:'',answer:''},{id:'rd-focus',name:'Phân tích tập trung',view:'analysis',step:0,ai:true,patch:'',question:'',answer:''}];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const action=(label,a,style='',extra='')=>`<button type="button" class="ctl ${style}" data-act="${a}" ${extra}>${label}</button>`;
const cut=d=>d.patch==='F01'||d.patch==='F02';
const score=d=>cut(d)?'0,0000':'41,2825';
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{dashboard_designs:defs.map(d=>({name:d.name,view:d.view,patch:d.patch,ai_open:d.ai}))},privateContent:{designs:defs.map(d=>({id:d.id,view:d.view,step:d.step,ai:d.ai,patch:d.patch}))}}).catch(()=>{});}
function brand(label){return `<header class="chrome"><div class="concept"><div class="brand"><span class="mark">${icon('shield-check')}</span>RiskDesk</div><span class="eyebrow">${label}</span></div></header>`;}
function scope(){return `<div class="row"><span class="tag">Bản thiết kế</span><span class="tag good">Dữ liệu mẫu · chain-v1</span></div>`;}
function stats(d){return `<div class="stats"><div class="stat"><span class="muted tiny">Tài sản</span><div class="value">4</div><span class="tiny muted">1 máy cần bảo vệ</span></div><div class="stat"><span class="muted tiny">Phát hiện lỗ hổng</span><div class="value">3</div><span class="tiny muted">Trên Web, App và Test</span></div><div class="stat"><span class="muted tiny">Đường tới DB01</span><div class="value">${cut(d)?'0':'1'}</div><span class="tiny muted">${cut(d)?'Sau mô phỏng vá':'Theo mô hình đã khai báo'}</span></div></div>`;}
function path(d){return `<div class="path" role="img" aria-label="${cut(d)?'Đường tấn công tới DB bị chặn':'Đường từ Internet qua Web, App tới DB'}"><div class="node"><strong>Internet</strong><span class="tiny muted">Điểm bắt đầu</span></div><span class="arrow">→</span><div class="node"><strong>WEB01</strong><span class="tiny muted">${d.patch==='F01'?'F01 đã vá':'F01'}</span></div><span class="arrow">${cut(d)?'×':'→'}</span><div class="node"><strong>APP01</strong><span class="tiny muted">${d.patch==='F02'?'F02 đã vá':'F02'}</span></div><span class="arrow">→</span><div class="node target"><strong>DB01</strong><span class="tiny">Tài sản đích</span></div></div>`;}
function ranktable(d,compact=false){let rows=d.patch?[['F01','WEB01','7,5'],['F02','APP01','8,0'],['F03','TEST01','9,8']].filter(r=>r[0]!==d.patch):[['F01','WEB01','7,5'],['F02','APP01','8,0'],['F03','TEST01','9,8']];return `<div class="tablewrap"><table><thead><tr><th>Phát hiện</th><th>CVSS</th><th class="num">Giảm rủi ro</th>${compact?'':'<th>Ưu tiên</th>'}<th></th></tr></thead><tbody>${rows.map(([f,a,c])=>{const valuable=!cut(d)&&f!=='F03';return `<tr><td><strong>${f}</strong><div class="tiny muted">${a}</div></td><td>${c}</td><td class="num">${valuable?'41,2825':'0'}</td>${compact?'':`<td><span class="${valuable?'rankpill':'tag'}">${valuable?'Đồng hạng 1':cut(d)?'Không giảm thêm':'Hạng 2'}</span></td>`}<td>${action('Thử vá','patch','small',`data-finding="${f}"`)}</td></tr>`}).join('')}</tbody></table></div>`;}
function ai(d){return `<aside class="ai-panel" aria-label="Trợ lý AI"><div class="row between"><h3>${icon('sparkles')} Trợ lý AI</h3>${d.id==='rd-overview'?action('Đóng','close-ai','quiet small'):''}</div><div class="muted tiny">Hỏi về dữ liệu và báo cáo đang xem.</div><div class="ai-context"><span class="eyebrow">Ngữ cảnh</span><div style="margin-top:7px">chain-v1 · Đích DB01<br>${d.patch?'Mô phỏng vá '+d.patch:'Chưa mô phỏng vá'}</div></div><div class="stack" style="gap:8px"><button type="button" class="ai-question" data-act="prompt" data-q="Tôi nên xử lý lỗi nào trước?">Tôi nên xử lý lỗi nào trước?</button><button type="button" class="ai-question" data-act="prompt" data-q="Vì sao F03 có CVSS cao nhưng ưu tiên thấp?">Vì sao F03 chưa được ưu tiên?</button></div><div class="ai-answer" aria-live="polite"><div class="tiny muted" style="margin-bottom:6px">${d.answer?'Phản hồi minh họa':'AI chưa được gọi'}</div>${esc(d.answer||'Chọn một câu hỏi hoặc nhập nội dung bên dưới. AI chỉ giải thích, không thay đổi điểm hay thứ hạng.')}</div><form class="ai-form"><label class="tiny" for="${d.id}-q">Câu hỏi của bạn</label><textarea id="${d.id}-q" name="question" placeholder="Hỏi về dữ liệu đang xem…">${esc(d.question)}</textarea><button type="submit" class="ctl primary">${icon('sparkles')} Gọi AI giải thích</button><div class="ai-disclaimer">Bản xem trước dùng trả lời mẫu, chưa kết nối Ollama.</div></form></aside>`;}
function head(d,title,sub){return `<div class="page-head"><div><div class="eyebrow" style="margin-bottom:8px">Không gian làm việc</div><h2>${title}</h2><div class="sub">${sub}</div></div>${action(icon('sparkles')+' Hỏi AI','open-ai','ai')}</div>`;}
function analysis(d){return `${head(d,'Ưu tiên khắc phục','Thử một phương án và xem điều gì thay đổi.')}<div class="row between">${scope()}${d.patch?action('Bỏ mô phỏng','reset','small'):''}</div><div class="mini-strip"><span><span class="muted tiny">Rủi ro tới DB01</span><br><strong>${score(d)}</strong><span class="tiny muted"> / 100</span></span><span><span class="muted tiny">Đường còn lại</span><br><strong>${cut(d)?0:1}</strong></span><span class="tag ${d.patch?'good':''}">${d.patch?'Đang thử vá '+d.patch:'Dữ liệu gốc được giữ nguyên'}</span></div><div class="sheet"><div class="sheet-head"><h3>Phát hiện cần xem xét</h3><span class="tiny muted">Xếp theo mức giảm rủi ro</span></div>${ranktable(d)}<div class="footer-note">${cut(d)?'Mức giảm thêm bằng 0 trong phạm vi DB01; không có nghĩa các lỗi còn lại an toàn.':'F01 và F02 có hiệu quả bằng nhau. Không dùng thứ tự dòng để phá đồng hạng.'}</div></div><div class="sheet section-gap"><h3>Đường tới tài sản quan trọng</h3>${path(d)}</div><div class="footer-note">Điểm mô hình, không phải xác suất tấn công. Mô phỏng không cài bản vá thật.</div>`;}
function overview(d){return `${head(d,'Tổng quan','Một nơi để xem dữ liệu và chọn việc tiếp theo.')}<div class="row between" style="margin-bottom:18px">${scope()}${action(icon('upload')+' Nhập dữ liệu','nav-data','small')}</div>${stats(d)}<div class="sheet section-gap"><div class="sheet-head"><div><h3>Việc nên xem trước</h3><div class="tiny muted">Ưu tiên theo tác động tới DB01</div></div>${action('Mở phân tích →','nav-analysis','small')}</div>${ranktable(d,d.ai)}<div class="footer-note">${cut(d)?'Đường tới DB đã bị chặn trong phương án này.':'F01 và F02 đồng hạng; F03 nằm ngoài đường tới DB.'}</div></div><div class="sheet section-gap"><div class="sheet-head"><h3>Đường tấn công tới DB01</h3><span class="tag">Mô phỏng</span></div>${path(d)}</div>`;}
function assets(d){return `${head(d,'Tài sản','Nhìn rõ vai trò và mức quan trọng của từng máy.')}<div class="sheet"><div class="sheet-head"><h3>Danh sách tài sản</h3>${action('+ Thêm tài sản','add-asset','small')}</div><div class="tablewrap"><table><thead><tr><th>Tài sản</th><th>Vai trò</th><th>Quan trọng</th><th>Internet</th></tr></thead><tbody>${[['WEB01','Máy Web','3 / 5','Có'],['APP01','Máy ứng dụng','4 / 5','Không'],['DB01','Cơ sở dữ liệu','5 / 5','Không'],['TEST01','Máy thử nghiệm','1 / 5','Có']].map(r=>`<tr><td><strong>${r[0]}</strong></td>${r.slice(1).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div><div class="sheet section-gap" data-asset-form hidden><h3>Thêm tài sản</h3><div class="field-grid section-gap"><label>Mã tài sản<input placeholder="Ví dụ: WEB02"></label><label>Tên tài sản<input placeholder="Máy chủ website"></label><label>Loại tài sản<select><option>Máy chủ Web</option><option>Cơ sở dữ liệu</option><option>Máy trạm</option></select></label><label>Mức quan trọng<select><option>Chưa biết</option><option>1 — Thấp</option><option>5 — Rất cao</option></select></label></div><div class="footer-note">Biểu mẫu xem trước, chưa lưu vào dữ liệu của bạn.</div></div>`;}
function data(d){return `${head(d,'Dữ liệu đầu vào','Nạp một bộ dữ liệu và kiểm tra trước khi phân tích.')}<div class="sheet"><h3>Nhập bộ dữ liệu</h3><div class="drop section-gap">${icon('file-up')}<strong>Chọn dataset.json</strong><span class="tiny muted">Tài sản, dịch vụ, lỗ hổng và kết nối</span><input class="file-input" type="file" accept=".json" aria-label="Chọn file dataset JSON"><div class="tiny muted" data-file-status>Bản thiết kế không tải hoặc lưu file của bạn.</div></div><div class="listitem"><span><strong>chain-v1</strong><br><span class="tiny muted">4 tài sản · 4 dịch vụ · 3 phát hiện</span></span><span class="tag good">Đang dùng · dữ liệu mẫu</span></div><div class="row section-gap">${action('Xem dữ liệu mẫu','nav-assets')}${action('Hỏi AI về dữ liệu','open-ai','ai')}</div></div><div class="notice section-gap">Phân biệt hồ sơ tự khai báo với dữ liệu đủ điều kiện phân tích. Không tự điền giá trị còn thiếu.</div>`;}
function reports(d){return `${head(d,'Báo cáo & lịch sử','Kết quả, phương án mô phỏng và giải thích ở cùng một nơi.')}<div class="sheet"><div class="sheet-head"><h3>Báo cáo đang xem</h3><span class="tag good">chain-v1</span></div><div class="listitem"><span>Phạm vi phân tích</span><strong>Internet → DB01</strong></div><div class="listitem"><span>Phương án vá</span><strong>${d.patch||'Chưa vá'}</strong></div><div class="listitem"><span>Rủi ro theo mô hình</span><strong>${score(d)}</strong></div><div class="row section-gap">${action(icon('download')+' Xuất JSON','export')}${action('Xuất Markdown','export')}${action(icon('sparkles')+' AI tóm tắt','open-ai','ai')}</div><div class="tiny muted section-gap" data-export-status>Thao tác xuất trong bản vẽ chỉ minh họa vị trí chức năng.</div></div><div class="sheet section-gap"><h3>Lịch sử</h3><div class="listitem"><span>Báo cáo mô phỏng · chain-v1</span><span class="tag">Bản mẫu</span></div><div class="listitem"><span>Dữ liệu nhập và giải thích đã lưu</span><span class="tiny muted">Xem theo từng bộ dữ liệu</span></div></div>`;}
const views={overview,assets,data,analysis,reports};
function renderOverview(d){const nav=[['overview','layout-dashboard','Tổng quan'],['assets','server','Tài sản'],['data','database','Dữ liệu'],['analysis','route','Phân tích'],['reports','file-text','Báo cáo']];return `${brand('Tổng quan gọn')}<div class="layout"><nav class="sidebar" aria-label="Chức năng chính"><div class="side-label">KHÔNG GIAN LÀM VIỆC</div>${nav.map(([v,i,l])=>`<button type="button" class="navitem ${d.view===v?'active':''}" data-act="navigate" data-view="${v}" aria-current="${d.view===v?'page':'false'}">${icon(i)} ${l}</button>`).join('')}<div class="side-foot">Dữ liệu minh họa<br>Không quét hoặc vá thật</div></nav><main class="main" aria-live="polite">${(views[d.view]||overview)(d)}</main>${d.ai?ai(d):''}</div>`;}
function renderGuided(d){const labels=['Chuẩn bị dữ liệu','Khai báo kết nối','Phân tích & thử vá','Báo cáo'];let body;if(d.step===0)body=d.view==='assets'?assets(d):data(d);else if(d.step===1)body=`${head(d,'Các máy liên hệ với nhau ra sao?','Chỉ khai báo kết nối và điều kiện có căn cứ.')}<div class="sheet"><div class="sheet-head"><h3>Sơ đồ đang xét</h3><span class="tag">Kịch bản mẫu</span></div>${path(d)}<div class="listitem"><span>Internet → Web</span><span class="tiny">F01 · vào Web</span></div><div class="listitem"><span>Web → App</span><span class="tiny">F02 · kiểm soát App</span></div><div class="listitem"><span>App → DB</span><span class="tiny">Quyền truy cập có sẵn</span></div></div><div class="notice section-gap">Kết nối mạng và khả năng khai thác là hai điều khác nhau.</div>`;else if(d.step===2)body=analysis(d);else body=reports(d);return `${brand('Từng bước rõ ràng')}<div class="main"><div class="row between" style="margin-bottom:18px"><span class="muted tiny">Không gian làm việc / Dữ liệu mẫu</span>${scope()}</div><nav class="steps" aria-label="Các bước phân tích">${labels.map((l,i)=>`<button type="button" class="step ${i===d.step?'active':''}" data-act="step" data-step="${i}" aria-current="${i===d.step?'step':'false'}"><span class="step-num">${i+1}</span><span>${l}</span></button>`).join('')}</nav><div class="flow-layout"><main class="viewslot" aria-live="polite">${body}<div class="row between section-gap">${action('← Quay lại','prev','quiet',d.step===0?'disabled':'')}${action(d.step===3?'Xem lại dữ liệu':'Tiếp tục →','next','primary')}</div></main>${ai(d)}</div></div>`;}
function renderFocus(d){return `${brand('Phân tích tập trung')}<div class="chrome"><div class="row between"><div class="focus-title"><h2>Không gian phân tích</h2><span class="tag good">chain-v1 · DB01</span></div>${action(icon('file-text')+' Báo cáo','nav-reports')}</div><nav class="tabs" aria-label="Các khu vực"><button type="button" class="tab ${d.view==='analysis'?'active':''}" data-act="navigate" data-view="analysis">Phân tích & mô phỏng</button><button type="button" class="tab ${d.view==='assets'?'active':''}" data-act="navigate" data-view="assets">Tài sản</button><button type="button" class="tab ${d.view==='data'?'active':''}" data-act="navigate" data-view="data">Dữ liệu</button><button type="button" class="tab ${d.view==='reports'?'active':''}" data-act="navigate" data-view="reports">Báo cáo</button></nav></div><div class="focus-body"><main class="focus-main" aria-live="polite">${(views[d.view]||analysis)(d)}</main>${ai(d)}</div>`;}
function draw(d){const el=document.getElementById(d.id);el.innerHTML=d.id==='rd-overview'?renderOverview(d):d.id==='rd-guided'?renderGuided(d):renderFocus(d);if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function answer(d,q){d.question=q;d.answer=cut(d)?`Trong phương án vá ${d.patch}, đường từ Internet tới DB01 đã bị chặn. Chỉ số tới DB01 giảm từ 41,2825 xuống 0 trong mô hình này. Các máy và lỗ hổng khác vẫn cần được xem xét.`:/F03|cao/i.test(q)?'F03 có CVSS 9,8 nhưng nằm trên TEST01, ngoài đường tới DB01. Vá F03 chưa làm giảm rủi ro tới DB. F01 và F02 cùng chặn được đường này nên đồng hạng ưu tiên.':'Với mục tiêu bảo vệ DB01, F01 và F02 đồng hạng: vá riêng một trong hai đều chặn một đường và giảm 41,2825 điểm. Điểm số do engine tính; AI chỉ diễn giải.';}
for(const d of defs){const el=document.getElementById(d.id);el.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;if(a==='navigate')d.view=b.dataset.view;else if(a==='nav-analysis'){d.view='analysis';d.step=2;}else if(a==='nav-data'){d.view='data';d.step=0;}else if(a==='nav-assets')d.view='assets';else if(a==='nav-reports'){d.view='reports';d.step=3;}else if(a==='step')d.step=Number(b.dataset.step);else if(a==='next')d.step=(d.step+1)%4;else if(a==='prev')d.step=Math.max(0,d.step-1);else if(a==='patch'){d.patch=b.dataset.finding;d.view='analysis';if(d.id==='rd-guided')d.step=2;d.answer='';}else if(a==='reset'){d.patch='';d.answer='';}else if(a==='open-ai')d.ai=true;else if(a==='close-ai')d.ai=false;else if(a==='prompt'){answer(d,b.dataset.q);d.ai=true;}else if(a==='add-asset'){el.querySelector('[data-asset-form]').hidden=false;return;}else if(a==='export'){el.querySelector('[data-export-status]').textContent='Vị trí nút xuất đã được chọn. Bản xem trước chưa tạo báo cáo thật.';return;}draw(d);if(a==='open-ai')el.querySelector('textarea')?.focus();save();});el.addEventListener('submit',e=>{e.preventDefault();const q=e.target.querySelector('textarea')?.value.trim();if(!q)return;answer(d,q);draw(d);save();});el.addEventListener('change',e=>{if(e.target.type==='file'){const note=el.querySelector('[data-file-status]');if(note)note.textContent=e.target.files[0]?'Đã chọn '+e.target.files[0].name+' · chưa nhập vào ứng dụng.':'Chưa chọn file.';}});}
function restore(state){const saved=state?.privateContent?.designs;if(!Array.isArray(saved))return;for(const x of saved){const d=defs.find(v=>v.id===x.id);if(!d)continue;if(views[x.view])d.view=x.view;if(Number.isInteger(x.step)&&x.step>=0&&x.step<4)d.step=x.step;if(typeof x.ai==='boolean')d.ai=x.ai;if(['','F01','F02','F03'].includes(x.patch))d.patch=x.patch;}}
restore(window.openai?.widgetState);defs.forEach(draw);
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);defs.forEach(draw);}});
if(globalThis.Tweak){for(const d of defs){const el=document.getElementById(d.id);const design={spacing:24,radius:16};const tweak=new Tweak({container:el,onChange:()=>{el.style.setProperty('--rd-space',design.spacing+'px');el.style.setProperty('--rd-radius',design.radius+'px');}});tweak.addSlider(design,'spacing',{label:'Khoảng thoáng',min:16,max:32,step:2,unit:'px'});tweak.addSlider(design,'radius',{label:'Bo góc',min:6,max:20,step:2,unit:'px'});}}
})();
</script>
