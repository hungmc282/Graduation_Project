[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graduation-project-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "networkx>=3,<4", "httpx>=0.27,<1", "streamlit>=1.66,<2", "sqlalchemy>=2,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common", "common.*", "sv1_data", "sv1_data.*", "sv2_attack_graph", "sv2_attack_graph.*", "sv3_risk", "sv3_risk.*", "sv4_app_llm", "sv4_app_llm.*"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
